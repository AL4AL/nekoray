name: Nekoray build matrix - cmake

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (default: nekoray_version.txt on push / when left empty)"
        required: false
      publish:
        description: "Publish: If want ignore"
        required: false
      artifact-pack:
        description: "artifact-pack: If want ignore"
        required: false

# the default GITHUB_TOKEN is read-only on new repos; ghr needs to create
# the release (and its assets)
permissions:
  contents: write
jobs:
  build-go:
    strategy:
      matrix:
        cross_os: [windows, linux]
        cross_arch: [amd64]
        include:
          - cross_os: public_res
            cross_arch: public_res
      fail-fast: false
    # Pin image: ubuntu-latest is migrating to Ubuntu 26 (runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - name: Checking out sources
        uses: actions/checkout@v6
      - name: Go Status
        run: git ls-files go | xargs cat | sha1sum > go_status
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v5
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('libs/*.sh', 'patches/*.patch', 'go_status', '*.txt') }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          # pinned: newer toolchains break github.com/sagernet/sing's
          # go:linkname into net (invalid reference to net.errNoSuchInterface)
          go-version: "1.22.2"
          # no go.mod at repo root; we cache the built artifacts.tgz ourselves
          cache: false
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          [ ${{ matrix.cross_os }} == public_res ] || ./libs/get_source.sh
          [ ${{ matrix.cross_os }} == public_res ] || GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./libs/build_go.sh
          [ ${{ matrix.cross_os }} == public_res ] || exit 0
          ./libs/build_public_res.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czvf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v6
        with:
          name: NekoRay-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz
  build-cpp:
    strategy:
      matrix:
        include:
          - platform: windows-2025
            arch: x64
            qt_version: "6.7"
          - platform: ubuntu-22.04
            arch: x64
            qt_version: "5.12"
      fail-fast: false

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Install MSVC compiler
        if: runner.os == 'Windows'
        # Drop-in for ilammy/msvc-dev-cmd@v1 (still node20); this fork runs on node24.
        uses: step-security/msvc-dev-cmd@v1
        with:
          # 14.1 is for vs2017, 14.2 is vs2019, following the upstream vcpkg build from Qv2ray-deps repo
          toolset: 14.2
          arch: ${{ matrix.arch }}
      # ========================================================================================================= Qt Install
      - name: Windows - Download Custom Qt ${{ matrix.qt_version }} SDK
        shell: bash
        if: runner.os == 'Windows'
        env:
          DL_QT_VER: ${{ matrix.qt_version }}
        run: bash ./libs/download_qtsdk_win.sh
      # ========================================================================================================= 编译与 Qt 无关的依赖
      # Ninja is preinstalled on GitHub-hosted runners; seanmiddleditch/gha-setup-ninja is archived (node20).
      - name: Cache Download
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: libs/deps
          key: DepsCache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('libs/build_deps_*.sh') }}-Qt${{ matrix.qt_version }}
      - name: Build Dependencies
        shell: bash
        if: steps.cache-deps.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: ./libs/build_deps_all.sh
      - name: Build Dependencies (Docker)
        shell: bash
        if: steps.cache-deps.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          docker run --rm \
            -v $PWD:/nekoray \
            -w /nekoray \
            ghcr.io/matsuridayo/debian10-qt5:20230131 \
            bash -c "./libs/build_deps_all.sh"
      # ========================================================================================================= Generate MakeFile and Build
      - name: Windows - Generate MakeFile and Build
        shell: bash
        if: runner.os == 'Windows'
        env:
          DL_QT_VER: ${{ matrix.qt_version }}
          CC: cl.exe
          CXX: cl.exe
        run: |
          source libs/env_qtsdk.sh $PWD/qtsdk/Qt
          mkdir build
          cd build
          # POLICY_VERSION_MINIMUM: CMake 4 hard-errors on deps with cmake_minimum_required < 3.5
          # -Wno-deprecated: silence QHotkey submodule still declaring VERSION 3.1 (< 3.10)
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -Wno-deprecated ..
          ninja -j2
          cd ..
          ./libs/deploy_windows64.sh
      - name: Linux - Generate MakeFile and Build
        shell: bash
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v $PWD:/nekoray \
            -w /nekoray \
            ghcr.io/matsuridayo/debian10-qt5:20230131 \
            bash -c "mkdir build && pushd build && cmake -GNinja -DCMAKE_BUILD_TYPE=Release .. && ninja && popd &&./libs/deploy_linux64.sh"
      # ========================================================================================================= Deployments
      - name: Tar files
        shell: bash
        run: tar czvf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v6
        with:
          name: NekoRay-${{ github.sha }}-${{ matrix.platform }}-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: artifacts.tgz
  publish:
    name: Pack & Publish Release
    if: github.event.inputs.artifact-pack != 'y'
    # Pin image: ubuntu-latest is migrating to Ubuntu 26 (runner-images#14748).
    runs-on: ubuntu-24.04
    needs:
      - build-cpp
      - build-go
    steps:
      - name: Checking out sources
        uses: actions/checkout@v6
      - name: Resolve release tag
        id: ver
        run: |
          TAG='${{ github.event.inputs.tag }}'
          if [ -z "$TAG" ]; then
            TAG=$(tr -d '[:space:]' < nekoray_version.txt)
          fi
          if [ -z "$TAG" ]; then
            echo "empty release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: download-artifact
      - name: Pack
        run: |
          curl -Lo - https://github.com/tcnksm/ghr/releases/download/v0.13.0/ghr_v0.13.0_linux_amd64.tar.gz | tar xzv
          mv ghr*linux_amd64/ghr .
          ####
          source libs/env_deploy.sh
          find . -name artifacts.tgz | xargs -n1 tar xvzf
          cd deployment
          cp -r public_res/* linux64
          cp -r public_res/* windows64
          rm -rf public_res *.pdb
          ####
          mv linux64 nekoray
          zip -r $version_standalone-linux64.zip nekoray
          rm -rf nekoray
          ####
          mv windows64 nekoray
          zip -r $version_standalone-windows64.zip nekoray
          rm -rf nekoray
      - name: Pack Debian
        run: |
          source libs/env_deploy.sh
          find . -name artifacts.tgz | xargs -n1 tar xvzf
          cd deployment
          cp -r public_res/* linux64
          ####
          # emits nekoray_<tag>_amd64.deb (Debian Policy file naming)
          bash ../libs/package_debian.sh ${{ steps.ver.outputs.tag }}
          rm -rf nekoray
      - name: Pack AppImage
        run: |
          source libs/env_deploy.sh
          find . -name artifacts.tgz | xargs -n1 tar xvzf
          cd deployment
          cp -r public_res/* linux64
          ####
          bash ../libs/package_appimage.sh
          mv nekobox-x86_64.AppImage $version_standalone-linux-x64.AppImage
      - name: Clean Up
        run: |
          cd deployment
          rm -rf linux64
          rm -rf windows64
          rm -rf public_res
          rm -rf *.pdb
      - name: Uploading Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Deployment-${{ github.sha }}
          path: deployment
      - name: Release
        if: github.event.inputs.publish != 'y'
        run: |
          ./ghr -delete -t "${{ github.token }}" -n "${{ steps.ver.outputs.tag }}" "${{ steps.ver.outputs.tag }}" deployment
